name: macOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install CMake and Ninja
        run: brew install cmake ninja
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos-x64
      - name: Configure the x86-64 build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Check that every test executable is registered with ctest
        run: python3 tools/check_test_registration.py build
      - name: Build
        run: cmake --build build --parallel
      - name: Measure the Rosetta guest address space
        run: ./build/macos_address_space > address-space.log 2>&1 && echo OK || { echo FAILED; tail -40 address-space.log; exit 1; }
      - name: Show the address-space log
        if: always()
        run: cat address-space.log
      - name: Build the prx libraries
        run: cmake --build build --target libs --parallel
      - name: Run the relinked guest and a guest thread
        run: tools/macos_guest_smoke.sh build > guest-smoke.log 2>&1 && echo OK || { echo FAILED; tail -40 guest-smoke.log; exit 1; }
      - name: Show the guest smoke log
        if: always()
        run: cat guest-smoke.log
      - name: Present the square homebrew through MoltenVK
        timeout-minutes: 15
        run: tools/macos_moltenvk_smoke.sh build > moltenvk-square.log 2>&1 && echo OK || { echo FAILED; tail -80 moltenvk-square.log; exit 1; }
      - name: Show the MoltenVK square log
        if: always()
        run: cat moltenvk-square.log
      - name: Run the guest and unit tests
        timeout-minutes: 90
        env:
          VK_DRIVER_FILES: ${{ github.workspace }}/build/vulkan/share/vulkan/icd.d/MoltenVK_icd.json
          VK_ICD_FILENAMES: ${{ github.workspace }}/build/vulkan/share/vulkan/icd.d/MoltenVK_icd.json
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/vulkan/lib
        run: ctest --test-dir build --output-on-failure --timeout 120 --parallel 4 --output-log ctest.log --output-junit build/ctest.xml
      - name: Check that every skip names a device limitation or a macOS gap
        run: python3 tools/check_skips.py build/ctest.xml --job macos --list && python3 tools/check_skips.py build/ctest.xml --job macos
      - name: Upload the square frame and the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moltenvk-square-frame
          path: |
            moltenvk-square.log
            build/macos-square/frame_000.bmp
            ctest.log
            build/ctest.xml
          if-no-files-found: ignore
